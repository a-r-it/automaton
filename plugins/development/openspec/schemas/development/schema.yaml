name: development
version: 1
description: development plugin workflow - proposal → specs → design
artifacts:
  - id: proposal
    generates: proposal.md
    description: Документ proposal — зачем нужно изменение и что оно затрагивает
    template: proposal.md
    instruction: >
      Создай документ proposal. Он отвечает на вопрос ЗАЧЕМ нужно это изменение.


      Секции. Заголовки — ровно эти английские строки, проза под ними по-русски:

      - **Why**: 1-2 предложения о проблеме или возможности. Какую задачу это
      решает? Почему сейчас?

      - **What Changes**: список изменений. Конкретно: какие возможности
      появляются, что меняется, что удаляется. Ломающие изменения помечай
      **BREAKING**.

      - **Capabilities**: какие спеки будут созданы или изменены:
        - **New Capabilities**: вводимые возможности. Каждая станет новым файлом `specs/<name>/spec.md`. Имена — kebab-case латиницей (например `user-auth`, `data-export`), потому что имя становится именем каталога.
        - **Modified Capabilities**: существующие возможности, у которых меняются ТРЕБОВАНИЯ. Включай только если меняется поведение на уровне спеки, а не детали реализации. Каждой нужен файл дельта-спеки. Имена существующих спек смотри в `openspec/specs/`. Оставь пустым, если требования не меняются.
      - **Impact**: затронутый код, API, зависимости, системы.


      ВАЖНО: секция Capabilities ключевая. Она создаёт контракт между этапами
      proposal и specs. Изучи существующие спеки, прежде чем её заполнять — каждой
      перечисленной здесь возможности понадобится свой файл спеки.


      Держи документ коротким, 1-2 страницы. Пиши «зачем», а не «как»: детали
      реализации живут в design.md.


      Границы. Нарушение любой из трёх — находка ревью, а не вопрос вкуса:


      - Ничего наблюдаемого не оставлено открытым. «Решим на этапе дизайна»,
      «оставляем открытым», «сроки не обещаем» — сказанное про то, что видит
      пользователь или клиент, здесь дефект. Откладывать КАК правильно и
      ожидаемо; откладывать ЧТО — нет, и спеки следом восстановить это уже не
      смогут.

      - Никаких механизмов. Имена протоколов и методов, выбор библиотек и
      пакетов, модель процессов и потоков, форма интерфейсов, архитектура тестов
      — всё это принадлежит design.md. Назвав механизм здесь, ты отвечаешь на
      вопрос, который этому документу задавать не положено, и каждый следующий
      читатель считает ответ решённым.

      - Каждый буллет What Changes несёт свою границу: что обещано и что
      сознательно не обещано. Безграничное обещание отправляет каждого
      рецензента искать край, и каждый находит свой.


      Пример:

      ```

      ## Why

      Пользователи не могут забрать свои данные, каждый такой запрос отрабатывает
      поддержка вручную.


      ## What Changes

      - Выгрузка данных пользователя в CSV. Обещаны состав полей и кодировка; не
      обещаны сроки готовности файла и выгрузка вложений.


      ## Capabilities


      ### New Capabilities

      - `data-export`: выгрузка данных пользователя по его запросу


      ## Impact

      Затрагивает модуль экспорта и публичный API личного кабинета.

      ```


      Это фундамент: спеки и дизайн строятся на нём.
    requires: []
  - id: specs
    generates: specs/**/*.md
    description: Дельта-спеки изменения — что система должна делать
    template: spec.md
    instruction: >
      Создай файлы спек, которые определяют, ЧТО система должна делать.


      Один файл на каждую возможность из секции Capabilities документа proposal.

      - Новые возможности: точное kebab-case имя из proposal
      (`specs/<capability>/spec.md`).

      - Изменяемые возможности: имя существующего каталога из
      `openspec/specs/<capability>/`, дельта-спека кладётся в
      `specs/<capability>/spec.md`.


      Операции дельты — заголовки уровня `##`:

      - **ADDED Requirements**: новое поведение

      - **MODIFIED Requirements**: изменённое поведение; ОБЯЗАН содержать
      полностью обновлённый блок

      - **REMOVED Requirements**: удаляемое поведение; ОБЯЗАН содержать
      **Reason** и **Migration**

      - **RENAMED Requirements**: только переименование; формат FROM:/TO:


      Требования к формату:

      - Каждое требование: `### Requirement: <имя>`, ниже текст требования

      - Одно требование — одно правило, и группируются они по правилам, а не по
      буллетам исходного материала. Детали одного правила — его сценарии: состав
      колонок и формат первой строки принадлежат требованию о выгрузке, а не
      становятся требованиями сами. Условие, при котором правило вообще
      применяется, — предусловие `Given`: «запрашивает аутентифицированный
      пользователь» это шаг, а не отдельное требование.

      - Признак верной границы: тело требования формулируется одной фразой без
      «и», и каждый его сценарий проверяет эту же фразу. Фраза разъехалась на
      два правила — режь надвое; сценарий проверяет чужую фразу — он положен не
      туда.

      - Тело требования — `<субъект> SHALL <действие>`, запрет — `SHALL NOT`.
      Формулировка требований по ISO/IEC/IEEE 29148, ключевые слова по BCP 14
      (RFC 2119, RFC 8174).

      - Каждый сценарий: `#### Scenario: <имя>`, ниже шаги на Gherkin — каждый с
      новой строки, ключевое слово в начале строки, без списочного дефиса и без
      разметки: `Given ...`, `When ...`, `Then ...`, `And ...`, `But ...`.

      - Обязательных шага два: `When` — триггер, `Then` — наблюдаемый результат.
      `Given` необязателен и добавляется, когда без предусловия сценарий неверен.
      `And` и `But` относятся к шагу прямо перед ними: `And` — ещё один шаг того
      же рода, `But` — его отрицательный двойник. Сценарий из одних When и Then —
      полноценная форма, а не урезанная.

      - Маркер `*` не используется — вместо него обычное ключевое слово.

      - Заголовок сценария — ровно четыре решётки: `#### Scenario: <имя>`. Ни
      три, ни буллет. Другие заголовки `#### ` внутри требования не ставятся.

      - У каждого требования ОБЯЗАН быть хотя бы один сценарий.


      Остальной словарь Gherkin доступен и используется по назначению:

      - `#### Scenario Outline:` с таблицей `Examples:` — когда правило одно, а
      значения разные: код ответа по состоянию, предел по тарифу, право по роли.
      Это лучше, чем три почти одинаковых сценария.

      - Doc String в тройных кавычках — когда нужно зафиксировать точный текст:
      строка заголовков файла, тело сообщения.

      - Таблица в шаге — когда перечисление длиннее двух-трёх пунктов: состав
      колонок, набор полей.

      - Блок под шагом — таблица или Doc String — пишется с отступом в два
      пробела, а сам шаг заканчивается двоеточием: `Then в файле присутствуют
      колонки:`. Без отступа блок встаёт в один ряд с шагами и читается как их
      продолжение.

      - Теги над требованием: первый — имя возможности, дальше минимум один из
      закрытого набора `@core`, `@negative`, `@limits`, `@audit`.

      - `Background` не используется: общее предусловие повторяется в каждом
      сценарии или уходит в текст требования.


      Порядок работы с MODIFIED:

      1. Найди существующее требование в `openspec/specs/<capability>/spec.md`

      2. Скопируй блок ЦЕЛИКОМ — от `### Requirement:` через все сценарии

      3. Вставь под `## MODIFIED Requirements` и отредактируй под новое поведение

      4. Убедись, что текст заголовка совпадает точно (пробелы не считаются)


      Добавляешь новое, не меняя существующего поведения — это ADDED.


      Пример:

      ```

      ## ADDED Requirements


      @export @core

      ### Requirement: Выгрузка данных пользователя

      Система SHALL выгружать все данные пользователя одним файлом CSV в
      кодировке UTF-8.


      #### Scenario: Успешная выгрузка

      Given у пользователя есть сохранённые записи

      When пользователь запрашивает выгрузку

      Then система отдаёт файл CSV в кодировке UTF-8

      And в файле присутствуют все записи пользователя


      #### Scenario: Записей нет

      When пользователь запрашивает выгрузку

      Then система отдаёт CSV с одной строкой заголовков


      #### Scenario: Состав колонок файла

      When пользователь запрашивает выгрузку

      Then в файле присутствуют колонки:
        | колонка    | обязательна |
        | id         | да          |
        | email      | да          |
        | created_at | да          |
        | last_login | нет         |

      #### Scenario: Формат первой строки

      When пользователь запрашивает выгрузку

      Then первая строка файла равна:
        """
        id,email,created_at,last_login
        """

      @export @negative

      ### Requirement: Отказ в выгрузке

      Система SHALL отказывать в выгрузке, когда аккаунт не в активном
      состоянии, и называть причину отказа.


      #### Scenario: Аккаунт заблокирован

      Given аккаунт пользователя заблокирован

      And у пользователя есть сохранённые записи

      When пользователь запрашивает выгрузку

      Then система отказывает

      And в ответе названа причина отказа

      But файл не формируется


      #### Scenario Outline: Ответ по состоянию аккаунта

      Given аккаунт пользователя в состоянии <состояние>

      When пользователь запрашивает выгрузку

      Then система отвечает кодом <код>

      And в ответе названа причина <причина>


      Examples:
        | состояние    | код | причина               |
        | заблокирован | 403 | аккаунт заблокирован  |
        | удалён       | 410 | аккаунт удалён        |
        | на проверке  | 409 | проверка не завершена |

      @export @audit

      ### Requirement: Запись факта выгрузки

      Система SHALL записывать каждую выгрузку в журнал аудита.


      #### Scenario: Выгрузка записана в журнал

      Given пользователь прошёл аутентификацию

      When пользователь запрашивает выгрузку

      Then система добавляет запись в журнал аудита

      And запись содержит идентификатор пользователя и время запроса


      ## REMOVED Requirements


      ### Requirement: Старая выгрузка

      **Reason**: Заменена новым механизмом выгрузки

      **Migration**: Использовать эндпоинт /api/v2/export

      ```


      Спеки должны быть проверяемыми: каждый сценарий — потенциальный тест.
    requires:
      - proposal
  - id: design
    generates: design.md
    description: Документ design — как изменение устроено технически
    template: design.md
    instruction: >
      Создай документ design. Он объясняет, КАК реализовать изменение.


      Секции. Заголовки — ровно эти английские строки, проза под ними по-русски:

      - **Context**: предыстория, текущее состояние, ограничения,
      заинтересованные стороны

      - **Goals / Non-Goals**: чего дизайн достигает и что явно оставляет за
      рамками

      - **Decisions**: принятые технические решения. Каждое — заголовком
      `### Decision: <что решено>`, ниже обоснование, ниже блок
      `**Alternatives considered:**` с отвергнутыми вариантами и причиной отказа
      по каждому.

      - **Risks / Trade-offs**: известные ограничения, что может пойти не так.
      Формат: [риск] → способ смягчения

      - **Migration Plan**: шаги выкатки и стратегия отката. Мигрировать нечего —
      скажи это одной строкой; пустая или отсутствующая секция не отличима от
      недодуманной.


      Требования к документу:

      - Каждое решение называет требования, которые закрывает, — теми словами,
      какими это позволяет проза документа.

      - Ни одно требование делта-спек не остаётся без решения. Требование, для
      которого решения нет, — дыра в дизайне, а не умолчание.

      - Отвергнутый подход записывается с причиной отказа. Это часть решения, а
      не выброшенная работа: читатель должен увидеть, что было рассмотрено и
      почему не взято.

      - Пиши про архитектуру и подход, а не про реализацию построчно. За
      мотивацией отсылай к proposal, за требованиями — к спекам: повторять их
      здесь значит завести вторую копию, которая разъедется с первой.


      Пример:

      ```

      ## Context

      Выгрузку сейчас делает поддержка вручную, формат каждый раз свой.


      ## Goals / Non-Goals


      **Goals:**

      - Один предсказуемый формат выгрузки


      **Non-Goals:**

      - Выгрузка вложений


      ## Decisions


      ### Decision: Файл формируется синхронно

      Закрывает требования «Выгрузка данных пользователя» и «Предел размера
      выгрузки». Ответ отдаётся в том же запросе: объём данных одного
      пользователя укладывается в предел ответа, и очередь ради этого не нужна.


      **Alternatives considered:**

      - Фоновая задача с уведомлением — отвергнута: добавляет очередь и хранение
      состояния ради случая, которого в текущих данных нет


      ## Risks / Trade-offs

      - Крупный аккаунт упрётся в таймаут → порог выносится в конфигурацию


      ## Migration Plan

      Выкатываем за флагом, включаем после проверки на внутренних аккаунтах.

      ```


      Хороший дизайн объясняет «почему» за техническими решениями.
    requires:
      - proposal
      - specs
